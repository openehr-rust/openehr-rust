[workspace]

[package]
name = "openehr-mariadb"
version = "0.7.4"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
description = "openEHR® persistence for MariaDB: schema dialect and DDL. openEHR® is the registered trademark of the openEHR Foundation and is used with the permission of openEHR International. Use of the trademark does not constitute endorsement of this product by openEHR International or openEHR Foundation. This project is an independent work."
keywords = ["openehr", "ehr", "mariadb", "healthcare", "sql"]
categories = ["database"]
repository = "https://github.com/openehr-rust/openehr-rust"
readme = "README.md"

[dependencies]
openehr = { path = "../openehr", version = "0.7.4" }
openehr-store = { path = "../openehr-store", version = "0.7.4" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }


[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"
