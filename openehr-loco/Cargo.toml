# An HTTP service over the openEHR store.
#
# This crate is why `db:S1.7` was amended. The *core* still implements no
# service: `openehr` and `openehr-store` have no HTTP, no runtime, and no
# server, and that boundary is what keeps them embeddable. The service lives
# out here, depends inward, and can be deleted without touching either.
[package]
name = "openehr-loco"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
description = "openEHR HTTP service built on Loco, Axum, and Tokio"
keywords = ["openehr", "ehr", "healthcare", "axum", "loco"]
categories = ["web-programming::http-server"]
repository = "https://github.com/openehr-rust/openehr-rust"
readme = "README.md"
# Not published. This crate sits outside the conformance ladder — every rung
# there is defined by DDL, a `Store`, or a database server (`W0.32`) — so it
# states evidence rather than a level, in README.md and in lib.rs. The status
# codes it exists for are now served and asserted in `tests/http.rs`; nothing
# has been run against a real deployment.
publish = false

[dependencies]
# `default-features = false` is the load-bearing line.
#
# Loco's defaults include `with-db`, which pulls SeaORM, sea-orm-migration, and
# sqlx. This repository already has a persistence layer — `openehr-store` and
# its six dialects — built on a storage model that is deliberately *not*
# shredded (`db:S1.5`). Taking Loco's would mean two persistence layers with
# two ideas of what a record is, and the one Loco brings does not know what a
# COMPOSITION is.
#
# So: no `with-db`, no `worker` (no queue), and no `auth`.
#
# `auth` is off for a separate reason: it is `jsonwebtoken`, and this service
# verifies PASETO v4.public instead (`db:PR12.14`). JWT negotiates its algorithm
# in a field the attacker supplies, which is the root of `alg: none` and of
# RS256-verified-as-HS256. PASETO's version *is* the algorithm, so there is
# nothing to negotiate. See `src/auth.rs`.
loco-rs = { version = "1.0.1", default-features = false, features = ["cli"] }
# Verification only. Nothing in this crate signs, and no secret key is ever
# loaded — a verified subject becomes an `AUDIT_DETAILS.committer` in an
# append-only chained history, so an instance able to mint tokens would be an
# instance able to fabricate evidence (`db:PR12.15`).
pasetors = "0.8"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
openehr = { path = "../openehr", version = "0.5.0" }
openehr-store = { path = "../openehr-store", version = "0.5.0" }
openehr-sqlite = { path = "../openehr-sqlite", version = "0.5.0" }
# Loco's `Hooks` is an `#[async_trait]` trait, so implementing it needs the
# same macro.
async-trait = "0.1"
time = { version = "0.3.55", features = ["formatting"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"
# `loco_rs::Error` is 128 bytes, so every fallible function in this crate trips
# `result_large_err`. Boxing it would make these signatures disagree with every
# `Hooks` and `Task` method they sit beside, which is a worse readability cost
# than the one the lint is warning about — and the error type is not ours to
# shrink. Allowed at the crate level rather than sprinkled, so the reason is
# recorded once instead of six times.
result_large_err = "allow"

[workspace]

[dev-dependencies]
loco-rs = { version = "1.0.1", default-features = false, features = ["cli", "testing"] }
tower = { version = "0.5.3", features = ["util"] }
