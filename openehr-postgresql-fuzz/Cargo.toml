# Fuzz targets for the postgresql dialect.
#
# Not published (`publish = false`): this is a test harness, and a crates.io
# release of it would claim to be part of the library's surface.
#
# The properties themselves live in `openehr_store::conformance`, shared by all
# six fuzz crates. Six copies of one assertion is the arrangement that produced
# **W-01**; a fuzz target here is a thin call and nothing more.
[package]
name = "openehr-postgresql-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[lints.rust]
# The eight fuzz crates carried no lint table at all until 2026-08-26, so
# `unsafe_code` was forbidden in the ten buildable crates and in none of the 21
# fuzz targets — while `AGENTS.md` said the tree forbids it. Every target also
# carries `#![forbid(unsafe_code)]`, and that is a guard only as wide as its
# file list: a target added tomorrow is covered by this table and not by an
# attribute nobody remembered to type.
unsafe_code = "forbid"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
openehr-store = { path = "../openehr-store" }
openehr-postgresql = { path = "../openehr-postgresql" }

[[bin]]
name = "quote"
path = "fuzz_targets/quote.rs"
test = false
doc = false
bench = false

[[bin]]
name = "col_sql"
path = "fuzz_targets/col_sql.rs"
test = false
doc = false
bench = false

[workspace]
