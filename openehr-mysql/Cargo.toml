[workspace]

[package]
name = "openehr-mysql"
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-SA-4.0"
description = "openEHR® persistence for MySQL: schema dialect and DDL. openEHR® is the registered trademark of the openEHR Foundation and is used with the permission of openEHR International. Use of the trademark does not constitute endorsement of this product by openEHR International or openEHR Foundation. This project is an independent work."
keywords = ["openehr", "ehr", "mysql", "healthcare", "sql"]
categories = ["database"]
repository = "https://github.com/openehr-rust/openehr-rust"
readme = "README.md"

[dependencies]
openehr = { path = "../openehr", version = "0.11.0" }
openehr-store = { path = "../openehr-store", version = "0.11.0" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }


[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `assert!(x.is_empty())` states the claim directly; the lint's `assert_eq!(x, [])` suggestion needs type annotations for no clarity gain.
assert_is_empty = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# RCA-ENF-4: a backstop. Any operator the lints miss panics, which is detectable,
# instead of wrapping, which is not. RCA-P-1 still forbids the panic.
[profile.release]
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
