# cargo-nextest configuration for the openehr-postgresql crate. Opt-in and local: CI keeps
# using `cargo test`. Run `cargo nextest run` from this directory (each crate is
# its own workspace); nextest does not run doctests, so also run
# `cargo test --doc`.

[profile.default]
# Report every failure, never stop at the first.
fail-fast = false
# Retries stay off: a retry hides a flaky test. Do not enable them here.
retries = 0
status-level = "pass"
final-status-level = "fail"
# Flag a test after 60s and kill it after 10 periods (10 minutes).
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
retries = 0
fail-fast = false
status-level = "fail"
final-status-level = "fail"
slow-timeout = { period = "60s", terminate-after = 10 }

# The live-server tests are `#[ignore]`d, so a plain run skips them exactly as
# `cargo test` does. Run them with `cargo nextest run --run-ignored all` (they
# need a real server, see tests/store.rs). nextest runs tests from different
# binaries at once, so they are serialised across binaries on their shared server.
[test-groups]
live-db = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(openehr-postgresql) & kind(test) & binary(/^(store|concurrency|tls)$/)'
test-group = "live-db"
