[workspace]

[package]
name = "openehr-postgresql"
version = "0.11.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
description = "openEHR® persistence for PostgreSQL: schema dialect and a real Store. openEHR® is the registered trademark of the openEHR Foundation and is used with the permission of openEHR International. Use of the trademark does not constitute endorsement of this product by openEHR International or openEHR Foundation. This project is an independent work."
keywords = ["openehr", "ehr", "postgresql", "healthcare", "sql"]
categories = ["database"]
repository = "https://github.com/openehr-rust/openehr-rust"
readme = "README.md"

[dependencies]
openehr = { path = "../openehr", version = "0.11.0" }
openehr-store = { path = "../openehr-store", version = "0.11.0" }
# The driver `PostgresqlStore` runs on: blocking, matching `Store`'s own
# synchronous trait, so nothing here needs its own async runtime -- the
# `postgres` crate manages one internally. `with-time-0_3`: the one feature
# this crate needs, converting a `timestamptz` column through `time`'s
# `OffsetDateTime` rather than a raw integer, which `postgres-types` has no
# `ToSql`/`FromSql` for directly.
postgres = { version = "0.19.14", features = ["with-time-0_3"] }
# TLS is mandatory for the network store (`db:O10.7`, `db:O10.18`). Rustls
# gives the crate one cross-platform verifier with no OpenSSL runtime
# dependency; the adapter implements `postgres`'s existing TLS trait. `ring`
# fixes the crypto provider rather than relying on process-global selection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["native-certs", "ring"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
# The other half of `with-time-0_3` above: this crate's own conversion code
# calls `OffsetDateTime::from_unix_timestamp`/`unix_timestamp` directly, not
# only through `postgres`'s own `ToSql`/`FromSql` impls.
time = "0.3.55"


[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `assert!(x.is_empty())` states the claim directly; the lint's `assert_eq!(x, [])` suggestion needs type annotations for no clarity gain.
assert_is_empty = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# RCA-ENF-4: a backstop. Any operator the lints miss panics, which is detectable,
# instead of wrapping, which is not. RCA-P-1 still forbids the panic.
[profile.release]
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
