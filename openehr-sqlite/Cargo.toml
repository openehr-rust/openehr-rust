[workspace]

[package]
name = "openehr-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "openEHR persistence for SQLite: schema dialect and a complete embedded store"
keywords = ["openehr", "ehr", "sqlite", "healthcare", "sql"]
categories = ["database"]
repository = "https://github.com/joelparkerhenderson/fhir-databases"
readme = "README.md"

[dependencies]
openehr = { path = "../openehr", version = "0.1.0" }
openehr-store = { path = "../openehr-store", version = "0.1.0" }
serde_json = { version = "1", features = ["preserve_order"] }
# `bundled` compiles a known SQLite rather than linking whatever the host
# ships. The generated DDL and the JSON1 functions the store uses are
# version-dependent, so the engine is pinned rather than discovered.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# The four other dialects, so one test can compare all five. The comparison has
# to live somewhere that can see every dialect, and `openehr-store` cannot —
# they depend on it. This crate is the one with a full test suite already, so
# the cross-check lives here rather than in a sixth crate existing only to hold
# one assertion.
openehr-postgresql = { path = "../openehr-postgresql", version = "0.1.0" }
openehr-mysql = { path = "../openehr-mysql", version = "0.1.0" }
openehr-mssql = { path = "../openehr-mssql", version = "0.1.0" }
openehr-oracle = { path = "../openehr-oracle", version = "0.1.0" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"
