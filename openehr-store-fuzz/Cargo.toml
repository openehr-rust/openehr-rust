# Fuzz targets for the persistence layer.
#
# Not published (`publish = false`): a test harness, not part of the library's
# surface.
#
# The six dialect fuzz crates cover four small functions each, and
# `openehr-fuzz` covers the Reference Model parsers. Between them sat
# `openehr-store` — projection, canonical JSON, and the audit chain — which is
# where a document *becomes rows* and where the integrity check that answers
# "has this record been tampered with" lives. Neither is a parser, and both
# take input that reached the process from outside it.
#
# The properties live in `openehr_store::conformance` (`W0.26`); a target here
# is a thin call and nothing more.
[package]
name = "openehr-store-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[lints.rust]
# The eight fuzz crates carried no lint table at all until 2026-08-26, so
# `unsafe_code` was forbidden in the ten buildable crates and in none of the 21
# fuzz targets — while `AGENTS.md` said the tree forbids it. Every target also
# carries `#![forbid(unsafe_code)]`, and that is a guard only as wide as its
# file list: a target added tomorrow is covered by this table and not by an
# attribute nobody remembered to type.
unsafe_code = "forbid"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
openehr = { path = "../openehr" }
openehr-store = { path = "../openehr-store" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }

[[bin]]
name = "project"
path = "fuzz_targets/project.rs"
test = false
doc = false
bench = false

[[bin]]
name = "integrity"
path = "fuzz_targets/integrity.rs"
test = false
doc = false
bench = false

[workspace]
