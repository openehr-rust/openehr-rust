# Continuous integration for every crate in this monorepo.
#
# This file exists because `openehr-store/spec/conformance.md` claimed it did,
# naming `.github/workflows/openehr.yml`, when no `.github/` directory had ever
# existed here (`spec/audit.md` W-02). Every Schema-level conformance claim
# rested on somebody running a script by hand.
#
# Two principles, both from the specification rather than from habit:
#
#   * The schema jobs MUST fail, never skip, when a database is absent
#     (`C0.13`). A skip is indistinguishable from a pass in a CI summary, and
#     the sibling FHIR monorepo carries a finding for two ports whose database
#     jobs invoked a test target that did not exist.
#
#   * The schema jobs invoke the same `verify-schema.sh` a contributor runs
#     locally, rather than a parallel implementation in YAML. Two ways of doing
#     one check drift, and the one that drifts is always the one nobody runs.
#     That is also why the script provisions its own container instead of using
#     GitHub's `services:`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Every crate is its own Cargo workspace, so each is built and tested
  # separately. A single `cargo test --workspace` would silently cover one of
  # the eight.
  test:
    name: test / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - openehr
          - openehr-store
          - openehr-sqlite
          - openehr-postgresql
          - openehr-mysql
          - openehr-mariadb
          - openehr-mssql
          - openehr-oracle
          - openehr-loco
          # `openehr-assets` carries nine unit tests and was in no matrix: the
          # `assets` job runs `cargo run -- check` and nothing ran `cargo test`
          # or clippy on it. Nine tests that never execute report the same green
          # as nine that pass (`spec/audit.md` W-12).
          - openehr-assets
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy,rustfmt
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      # Lints are `deny` in every manifest and clippy runs at `pedantic`. The
      # tree is at zero warnings; `RUSTFLAGS: -D warnings` keeps it there.
      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --all-targets --all-features

      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test --all-features

      # Doctests are claims that compile and run. A crate whose examples stop
      # working has documentation that is wrong, which is the defect class this
      # repository's audit register is mostly about.
      - name: Doc
        working-directory: ${{ matrix.crate }}
        run: cargo doc --no-deps --all-features

  # `spec/rust-msrv-n-minus-3/index.md`: the MSRV is N-3, a formula rather than a
  # number, and this job is the reason the formula is worth more than a number.
  #
  # It derives N from the stable toolchain it just installed, so the expected
  # value comes from the outside world on every run rather than from a constant
  # somebody has to remember to change. Two things follow:
  #
  #   * A stale number fails here within six weeks of every Rust release, on a
  #     commit that touched nothing to do with Rust versions. That is deliberate
  #     (`RV5`). The alternative is what this repository had: `rust-version =
  #     "1.90"` committed on 2026-08-01, when stable was 1.97, checked by
  #     nothing and wrong for `openehr-loco` from the day it was written
  #     (`spec/audit.md` W-09).
  #
  #   * The declared floor is COMPILED, not merely declared (`RV3`). An MSRV no
  #     toolchain has agreed to is a claim, and `W0.3` is about claims.
  #
  # Do not make this job `continue-on-error`, and do not relax the equality to a
  # lower bound. Either turns a check into a decoration, which is the defect
  # class the whole audit register is about.
  msrv:
    name: MSRV is N-3, declared everywhere, and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive N-3 from the current stable release
        id: msrv
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          n=$(rustup run stable rustc --version \
                | sed -nE 's/^rustc 1\.([0-9]+)\..*/\1/p')
          case "$n" in
            ''|*[!0-9]*)
              echo "::error::could not parse a minor version from rustc --version"
              exit 1 ;;
          esac
          [ "$n" -gt 3 ] || { echo "::error::stable minor $n makes N-3 nonsense"; exit 1; }
          echo "stable=1.$n"   >> "$GITHUB_OUTPUT"
          echo "msrv=1.$((n - 3))" >> "$GITHUB_OUTPUT"
          echo "stable is 1.$n, so N-3 is 1.$((n - 3))"

      # Checked separately from the build, and before it, so that "the number
      # went stale" and "the code stopped compiling on the floor" stay
      # distinguishable. They are different failures with different fixes, and
      # the first is a one-line sed.
      - name: Every manifest and every document declares exactly that version
        env:
          WANT: ${{ steps.msrv.outputs.msrv }}
          STABLE: ${{ steps.msrv.outputs.stable }}
        run: |
          set -eu
          bad=0

          # RV2: every crate, one number. A per-crate MSRV would mean the
          # repository has no MSRV -- a user of openehr-sqlite gets openehr and
          # openehr-store too, so the effective floor is the highest of them.
          n=0
          for f in */Cargo.toml; do
            n=$((n + 1))
            grep -qxF "rust-version = \"$WANT\"" "$f" \
              || { echo "::error file=$f::does not declare rust-version = \"$WANT\""; bad=1; }
          done
          [ "$n" -eq 18 ] || {
            echo "::error::found $n crate manifests, expected 18;"
            echo "::error::a crate this loop cannot see is a crate with no MSRV (W0.15)"
            bad=1
          }

          # RV4: prose names the same number. Via files rather than a heredoc:
          # an unquoted heredoc terminator must sit at column zero, which it
          # cannot inside a YAML block scalar, and the resulting script parses
          # as an unterminated string.
          grep -rn --include='*.md' --exclude-dir=target \
            -E 'Requires Rust [0-9]+\.[0-9]+\+ \(edition 2024\)' . > /tmp/rv-prose \
            || : # no hits is itself suspicious, but `RV4` binds the hits there are

          # Two documents are registers of what this number USED to be:
          # `spec/audit.md` W-09, and the specification's own "why a formula"
          # passage. A citation's whole value is that it does not change
          # (`W0.6`), so quoting the old floor there is correct and rewriting it
          # would destroy the finding. Everything else must match.
          historical() {
            case "$1" in
              *spec/audit.md:*|*spec/rust-msrv-n-minus-3/index.md:*|*CHANGELOG.md:*) return 0 ;;
              *) return 1 ;;
            esac
          }
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            historical "$hit" && continue
            case "$hit" in
              *"Requires Rust $WANT+ (edition 2024)"*) ;;
              *) echo "::error::$hit"
                 echo "::error::should read: Requires Rust $WANT+ (edition 2024)"
                 bad=1 ;;
            esac
          done < /tmp/rv-prose

          # `agents/adding-an-engine.md` pastes a manifest skeleton, and a
          # skeleton naming a floor nobody uses is how the next engine crate
          # acquires the wrong one.
          grep -rn --include='*.md' --exclude-dir=target \
            'rust-version = "' . > /tmp/rv-manifest-prose || :
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            historical "$hit" && continue
            case "$hit" in
              *"rust-version = \"$WANT\""*) ;;
              *) echo "::error::$hit"
                 echo "::error::should read: rust-version = \"$WANT\""
                 bad=1 ;;
            esac
          done < /tmp/rv-manifest-prose

          # The specification states today's two numbers in one fixed-form
          # sentence, so that the document defining the formula is itself
          # subject to it.
          want_line="is the current stable release. N is **$STABLE**, so the MSRV is **$WANT**."
          grep -qF "$want_line" spec/rust-msrv-n-minus-3/index.md || {
            echo "::error file=spec/rust-msrv-n-minus-3/index.md::should contain: $want_line"
            bad=1
          }

          [ "$bad" -eq 0 ] || {
            echo "::error::to fix, from the repository root:"
            echo "::error::  grep -rl 'rust-version = ' --include=Cargo.toml . | xargs sed -i 's/rust-version = \".*\"/rust-version = \"$WANT\"/'"
            echo "::error::then update the READMEs and spec/rust-msrv-n-minus-3/index.md to match"
            exit 1
          }
          echo "18 manifests and every document declare $WANT"

      - name: Install the floor
        run: |
          rustup toolchain install ${{ steps.msrv.outputs.msrv }} --profile minimal
          rustup run ${{ steps.msrv.outputs.msrv }} rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.msrv.outputs.msrv }}

      # The global `-D warnings` is dropped, for the same reason the mutants job
      # drops it: an older compiler emits a different set of lints, and a lint
      # that only exists on one of the two toolchains would fail this job for a
      # reason that has nothing to do with the MSRV. The `[lints]` tables in the
      # manifests still apply -- `missing_docs` is still deny, `unsafe_code` is
      # still forbid -- because those are per-package and not RUSTFLAGS.
      #
      # `cargo test`, not `cargo check`: an MSRV that compiles the library and
      # not its test suite is an MSRV under which nobody can develop.
      - name: Build and test every crate on the floor
        env:
          RUSTFLAGS: ""
        run: |
          set -eu
          bad=0
          for d in openehr openehr-store openehr-sqlite openehr-postgresql \
                   openehr-mysql openehr-mariadb openehr-mssql openehr-oracle \
                   openehr-loco openehr-assets; do
            echo "::group::$d on ${{ steps.msrv.outputs.msrv }}"
            ( cd "$d" && cargo +${{ steps.msrv.outputs.msrv }} test --all-features ) \
              || { echo "::error::$d does not build or test on ${{ steps.msrv.outputs.msrv }}"; bad=1; }
            echo "::endgroup::"
          done
          [ "$bad" -eq 0 ] || exit 1

  # The runnable tutorials the READMEs point at. A tutorial nobody runs is a
  # tutorial that rots -- and one in a README is read as a demonstration that
  # the thing works, which is a claim (`W0.3`).
  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openehr
      - name: Run the Reference Model tutorials
        working-directory: openehr
        run: |
          set -eu
          for e in 01_build_composition 02_validate_incoming 03_paths_and_aql \
                   04_versioning_and_audit 05_access_and_redaction; do
            printf '%s: ' "$e"
            cargo run -q --example "$e" >/dev/null
            echo ok
          done

      # The persistence tutorial. It lives in `openehr-sqlite` because that is
      # the only crate with a `Store` -- the other five supply a `Dialect` and
      # nothing else, so a tutorial there would demonstrate code that does not
      # exist (`C0.11`). It runs against a real in-process database and asserts
      # its own claims, including that a refused `UPDATE` left the row intact.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openehr-sqlite
      - name: Run the persistence tutorial
        working-directory: openehr-sqlite
        run: |
          set -eu
          printf '01_store_a_record: '
          cargo run -q --example 01_store_a_record >/dev/null
          echo ok

  # `W0.36`: benchmarks are RUN, never gated on. `--test` executes each one
  # once and asserts nothing about the time.
  #
  # There is no threshold here and there must not be one (`W0.35`). Wall-clock
  # on a shared runner varies by more than most real regressions, so a
  # threshold would fail for reasons unrelated to the change -- and a check that
  # fails for unrelated reasons is a check somebody silences. What this job
  # asserts is the only thing it honestly can: the benchmarks still compile and
  # still run. A committed benchmark nobody executes stops building within a few
  # refactors, and the first person to need a baseline finds a compile error.
  bench:
    name: benchmarks still run / ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [openehr, openehr-store]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Run every benchmark once
        working-directory: ${{ matrix.crate }}
        run: cargo bench --benches -- --test

  # Conformance level Dialect -> Schema. This is the job that turns "somebody
  # ran it once" into a standing claim.
  #
  # It has found a defect in every crate it has been run against: MySQL
  # rejecting `CREATE INDEX IF NOT EXISTS` (A-13), three dialects enforcing
  # append-only nowhere (A-15), and MariaDB emitting MySQL's script in its
  # entirety (W-01).
  schema:
    name: schema / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [postgresql, mysql, mariadb]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openehr-${{ matrix.engine }}

      # podman, not docker: it is what a contributor runs locally, and the
      # script defaults to it. Running a different runtime here than the one the
      # script was developed against is a divergence with no upside — the first
      # CI run failed on `schema / mysql` alone, and chasing an environment
      # difference is exactly the cost that divergence buys.
      #
      # Fail rather than skip if it is absent. A schema job that quietly does
      # nothing reports the same green as one that verified the DDL, which is
      # the precise failure `C0.13` forbids.
      - name: Require podman
        run: |
          command -v podman >/dev/null || {
            echo "::error::podman absent; this job must fail, not skip"
            exit 1
          }
          podman --version

      - name: Verify generated DDL against a real ${{ matrix.engine }} server
        run: sh openehr-store/scripts/verify-schema.sh ${{ matrix.engine }}

  # T11.9: fuzz targets must be RUN, not merely committed. A committed target
  # nobody executes is a claim, and this repository's whole audit register is
  # about the difference between a claim and a check.
  #
  # A crash, panic, abort, or stack overflow fails the build. The budget is
  # deliberately small per target -- this is a regression gate on every push,
  # not a fuzzing campaign; long campaigns belong on a schedule or a fuzzing
  # service, and neither exists here yet.
  fuzz:
    name: fuzz / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: postgresql, crate: openehr-postgresql, targets: "quote col_sql" }
          - { engine: sqlite,     crate: openehr-sqlite,     targets: "quote col_sql" }
          - { engine: mysql,      crate: openehr-mysql,      targets: "quote col_sql" }
          - { engine: mariadb,    crate: openehr-mariadb,    targets: "quote col_sql" }
          - { engine: mssql,      crate: openehr-mssql,      targets: "quote col_sql" }
          - { engine: oracle,     crate: openehr-oracle,     targets: "quote col_sql" }
          # The Reference Model parsers -- the untrusted surface the dialect
          # targets do not reach (`lib:A-09`). `uri` was written against
          # `lib:A-36` and finds that panic from an empty corpus.
          - { engine: openehr,    crate: openehr,            targets: "iso8601 object_id aql path canonical_json uri data_value" }
          # Projection and the integrity check: neither is a parser, and both
          # take input from outside the process (`W0.26`).
          - { engine: store,      crate: openehr-store,      targets: "project integrity" }
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}-fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Build separately from run, so a compile break is distinguishable from a
      # crash the fuzzer found. They are different failures with different fixes.
      - name: Build fuzz targets
        working-directory: ${{ matrix.crate }}
        run: cargo fuzz build --fuzz-dir ../${{ matrix.crate }}-fuzz

      - name: Fuzz
        working-directory: ${{ matrix.crate }}
        run: |
          set -eu
          for t in ${{ matrix.targets }}; do
            echo "::group::fuzz $t"
            cargo fuzz run --fuzz-dir ../${{ matrix.crate }}-fuzz "$t" -- -max_total_time=60
            echo "::endgroup::"
          done

      # A crash leaves an artifact. Upload it, because a fuzz failure whose
      # input is lost is a failure nobody can reproduce.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.engine }}
          path: ${{ matrix.crate }}-fuzz/artifacts/
          if-no-files-found: ignore

  # Generated artifacts under assets/ must match what the code renders. A
  # regeneration step nobody verifies is one that stops happening, and a stale
  # committed artifact is a lie that reviews are read against.
  assets:
    name: assets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: openehr-assets
      - name: Check
        working-directory: openehr-assets
        run: cargo run -- check

  # SQL Server and Oracle deliberately have no schema job: no server has ever
  # parsed their DDL, so both crates are at level Dialect and their
  # documentation says so. Adding a job that skipped would convert an honest
  # gap into a false green.
  #
  # This job asserts the gap is still the one recorded, so that a crate cannot
  # quietly start claiming Schema without a job to back it.
  layering:
    name: dependencies run inward only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `db:S1.7` and the whole architecture: `openehr` knows nothing of
      # storage, `openehr-store` knows nothing of any engine, and the service
      # depends on both and is depended on by nothing.
      #
      # This exists because the rule was broken by accident and committed. A
      # throwaway probe added `openehr-store` as a dev-dependency of `openehr`
      # — a cycle, and an inversion of the layering — and nothing objected,
      # because cargo permits dev-dependency cycles and no check looked.
      #
      # Dev-dependencies count. A test that reaches downward can only be
      # written because the layering allows it, and the next one will not be a
      # throwaway.
      # The list of crates to check against is DERIVED, not written down. It
      # used to be nine names in this file, which omitted `openehr-assets` and
      # all seven fuzz crates -- so a dev-dependency from `openehr` onto, say,
      # `openehr-sqlite-fuzz` (which depends on `openehr-sqlite`, which depends
      # on `openehr-store`, which depends on `openehr`) was a cycle this guard
      # could not see. That is `W-01` exactly: a guard is only as wide as its
      # input list, and the dialect it omitted was the one that was wrong.
      # `spec/audit.md` W-13.
      - name: openehr depends on nothing in this repository
        run: |
          set -eu
          bad=0
          crates=$(ls -d */Cargo.toml | sed 's|/Cargo.toml$||')
          n=$(echo "$crates" | wc -l | tr -d ' ')
          [ "$n" -eq 18 ] || {
            echo "::error::derived $n crates, expected 18 — the guard is looking at the wrong tree"
            exit 1
          }
          for crate in openehr openehr-store; do
            for other in $crates; do
              [ "$crate" = "$other" ] && continue
              # openehr-store may depend on openehr; nothing else is allowed.
              [ "$crate" = "openehr-store" ] && [ "$other" = "openehr" ] && continue
              # Both spellings cargo accepts. The inline form is what this
              # repository writes; the table form is what somebody adding a
              # `features` list writes, and it would have slipped past the
              # inline-only check.
              if grep -qE "^$other[[:space:]]*=" "$crate/Cargo.toml" \
                 || grep -qE "^\[(dev-|build-)?dependencies\.$other\]" "$crate/Cargo.toml"; then
                echo "::error::$crate/Cargo.toml depends on $other; dependencies run inward only"
                bad=1
              fi
            done
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "openehr and openehr-store depend only inward, checked against all $n crates"

  # Professionalization rule 5: every root document and every published crate's
  # rustdoc that uses the openEHR mark in prose carries the trademark notice
  # verbatim, non-affiliation sentence included. The checker existed and ran
  # green from one laptop before this job did — which rule 4 calls a claim, not
  # a guarantee, and the specification's own Status section said so. Same
  # principle as `verify-schema.sh`: CI invokes the script a contributor runs
  # locally, not a parallel implementation in YAML.
  trademarks:
    name: the trademark notice is carried verbatim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every in-scope use of the openEHR mark carries the notice
        run: python3 scripts/check-trademarks.py

  claims:
    name: conformance claims match evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No crate claims a level with no evidence here
        run: |
          set -eu
          for c in openehr-mssql openehr-oracle; do
            if grep -qE 'Conformance level:\s*\**(Schema|Store|Verified)' \
                 "$c/src/lib.rs" "$c/README.md"; then
              echo "::error::$c claims Schema or above, but no CI job verifies it"
              exit 1
            fi
          done
          echo "mssql and oracle still claim Dialect, as recorded"

      # `lib:A-26`: the library matrix said "every requirement id checked to
      # appear exactly once — 291 ids, 291 covered, none missing". That was
      # derived from the rows once, and then six requirements were added with
      # no row and nothing re-derived it.
      #
      # A boast about mechanical completeness should be mechanical.
      - name: Every requirement has exactly one row in the library matrix
        run: |
          python3 - <<'PY'
          import re, sys, glob, pathlib
          from collections import Counter

          def expand(cell):
              out = []
              for part in re.split(r"[,;]", cell):
                  part = part.strip().strip("`").strip()
                  if not part:
                      continue
                  # A lettered range: R4.12a-R4.12c
                  m = re.match(r"^([A-Z]+[0-9]*\.\d+)([a-z])\s*[\u2013-]\s*"
                               r"(?:[A-Z]+[0-9]*\.\d+)?([a-z])$", part)
                  if m:
                      base, a, b = m.groups()
                      out += [f"{base}{chr(c)}" for c in range(ord(a), ord(b) + 1)]
                      continue
                  # A numeric range: C0.1-C0.3
                  m = re.match(r"^([A-Z]+[0-9]*)\.(\d+)\s*[\u2013-]\s*"
                               r"(?:([A-Z]+[0-9]*)\.)?(\d+)$", part)
                  if m:
                      pre, a, pre2, b = m.groups()
                      if pre2 and pre2 != pre:
                          continue
                      out += [f"{pre}.{n}" for n in range(int(a), int(b) + 1)]
                      continue
                  m = re.match(r"^([A-Z]+[0-9]*\.\d+[a-z]?)$", part)
                  if m:
                      out.append(m.group(1))
              return out

          defined = set()
          for path in sorted(glob.glob("openehr/spec/*.md")):
              if pathlib.Path(path).name in ("conformance-matrix.md", "audit.md", "index.md"):
                  continue
              defined |= set(re.findall(r"^- \*\*([A-Z]+[0-9]*\.[0-9]+[a-z]?)\*\*",
                                        pathlib.Path(path).read_text(), re.M))

          seen = Counter()
          for line in pathlib.Path("openehr/spec/conformance-matrix.md").read_text().splitlines():
              if line.startswith("|"):
                  cells = [c.strip() for c in line.split("|")]
                  if len(cells) > 1 and cells[1] not in ("Id", "---"):
                      seen.update(expand(cells[1]))

          bad = 0
          for label, items in (
              ("defined with no row", sorted(defined - set(seen))),
              ("a row for a requirement that does not exist", sorted(set(seen) - defined)),
              ("covered more than once", sorted(k for k, v in seen.items() if v > 1)),
          ):
              if items:
                  bad = 1
                  print(f"::error::{label}: {', '.join(items)}")
          if not bad:
              print(f"{len(defined)} requirements, {len(defined)} covered exactly once")
          sys.exit(bad)
          PY

      # The library audit register's summary paragraph said "Seventeen
      # findings" while the table beneath it listed thirty-five, for as long
      # as findings kept being appended without anyone re-deriving the
      # headline. A hand count next to a table is exactly the kind of claim
      # `db:D-09` (below) exists to catch one level down — a boast the file
      # can quietly stop matching.
      - name: The audit summary counts itself correctly
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          text = pathlib.Path("openehr/spec/audit.md").read_text()

          # Split each candidate line on `|` directly rather than matching the
          # whole row with one regex: `\s*` matches a newline, so a regex
          # anchored on one row's opening `|` can walk `\s*` straight into the
          # *next* row and silently absorb it — found by testing this check
          # against the file it checks and getting 18 rows instead of 35.
          rows = []
          for line in text.splitlines():
              if not re.match(r"^\| A-\d+ \| (High|Medium|Low) \|", line):
                  continue
              cells = [c.strip() for c in line.strip().strip("|").split("|")]
              if len(cells) >= 4:
                  rows.append((cells[1], cells[-1]))
          if not rows:
              sys.exit("::error::no A-NN summary rows found in openehr/spec/audit.md")

          total = len(rows)
          by_severity = {"High": 0, "Medium": 0, "Low": 0}
          fixed = 0
          for severity, status in rows:
              by_severity[severity] += 1
              if "**fixed**" in status or "**classified**" in status:
                  fixed += 1
          open_ = total - fixed

          claimed = re.search(
              r"\*\*(\d+) findings, (\d+) in the table below: (\d+) High, "
              r"(\d+) Medium, (\d+) Low\. (\d+) fixed or classified, (\d+) open\.\*\*",
              re.sub(r"\s+", " ", text),
          )
          if not claimed:
              sys.exit(
                  "::error::the audit summary paragraph's fixed-form sentence "
                  "was not found — did its wording change? Update this check "
                  "and the sentence together."
              )
          n1, n2, high, medium, low, claimed_fixed, claimed_open = (
              int(x) for x in claimed.groups()
          )

          computed = {
              "findings (first count)": (n1, total),
              "findings (second count)": (n2, total),
              "High": (high, by_severity["High"]),
              "Medium": (medium, by_severity["Medium"]),
              "Low": (low, by_severity["Low"]),
              "fixed or classified": (claimed_fixed, fixed),
              "open": (claimed_open, open_),
          }
          bad = 0
          for label, (claimed_n, actual_n) in computed.items():
              if claimed_n != actual_n:
                  bad = 1
                  print(f"::error::{label}: paragraph says {claimed_n}, table has {actual_n}")
          if not bad:
              print(f"{total} findings, {fixed} fixed/classified, {open_} open — paragraph agrees")
          sys.exit(bad)
          PY

      # `W-10` and `W-11`: the published version was stated in five files and
      # updated in one, and `db:W16.1` said the repository held fourteen crates
      # while five other documents said seventeen. Both were counts — the
      # cheapest possible claim to check, and the easiest to leave behind.
      #
      # The residual recorded against **W-11** was this script's absence: the
      # jobs above derive the crate *list* from the tree, so a crate cannot hide
      # from a guard, but the *documents* were still hand-counted.
      #
      # A script, not a heredoc, so a contributor runs the same check CI runs —
      # the principle this file already applies to `verify-schema.sh`.
      - name: The documentation's counts and versions match the tree
        run: python3 scripts/check-docs.py

      # `db:D-09`: the matrix marked two requirements satisfied and listed the
      # same two as absent, in one file, for a day. The file that says "where
      # this disagrees with a crate's documentation, trust this" was disagreeing
      # with itself.
      #
      # This checks the one thing a check over prose honestly can. It cannot
      # tell whether a bullet is deserved — only that the file does not say
      # both.
      - name: The conformance matrix does not contradict itself
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          bad = 0
          for path in ("spec/databases/conformance-matrix.md",
                       "openehr/spec/conformance-matrix.md"):
              text = pathlib.Path(path).read_text()
              if "## Not implemented" not in text:
                  continue
              body, absent_section = text.split("## Not implemented", 1)
              # The service table is a different layer. A requirement the
              # service satisfies and the store does not is a scoped statement,
              # not a contradiction — the same shape as the per-engine table,
              # where `M3.17` is satisfied on four engines and absent on two.
              body = body.split("## Service requirements", 1)[0] + \
                     body.split("## Cross-cutting", 1)[-1]
              ids = lambda cell: set(re.findall(r"`([A-Z]+[0-9]*\.[0-9]+[a-z]?)`", cell))
              satisfied = set()
              for line in body.splitlines():
                  if not line.startswith("|"):
                      continue
                  cells = [c.strip() for c in line.split("|")]
                  if len(cells) > 2 and any(c == "\u2022" for c in cells[2:-1]):
                      satisfied |= ids(cells[1])
              absent = set()
              for line in absent_section.splitlines():
                  if line.startswith("|"):
                      cells = [c.strip() for c in line.split("|")]
                      if len(cells) > 1:
                          absent |= ids(cells[1])
              both = sorted(satisfied & absent)
              if both:
                  bad = 1
                  print(f"::error::{path} marks {', '.join(both)} satisfied and "
                        f"also lists them as not implemented")
          sys.exit(bad)
          PY
          echo "no requirement is both satisfied and absent"

      # W0.22-W0.23: one licence expression across the eight published crates
      # plus `openehr-loco` (unpublished, but distributed as source and worth
      # the same clarity), and LICENSE.md as the only licence file. Shipping
      # the full text of some licences and not others privileges those and
      # understates the grant.
      # `W0.22` says EVERY crate, and this loop checked nine of seventeen. The
      # eight it skipped -- `openehr-assets` and the seven fuzz harnesses -- had
      # no `license` field at all, and seven of the eight no `LICENSE.md`, for
      # as long as the list was written by hand. Derived from the tree now, for
      # the same reason as the layering job above (`spec/audit.md` W-14).
      #
      # `publish = false` is not a reason to skip one: these are distributed as
      # source in this repository whether or not they reach a registry, and an
      # unlicensed file in a licensed tree is the ambiguity the grant exists to
      # remove.
      - name: Licence expression is harmonized
        run: |
          set -eu
          want='license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"'
          bad=0
          n=0
          for d in $(ls -d */Cargo.toml | sed 's|/Cargo.toml$||'); do
            n=$((n + 1))
            grep -qxF "$want" "$d/Cargo.toml" \
              || { echo "::error file=$d/Cargo.toml::licence is not the harmonized five"; bad=1; }
            [ -f "$d/LICENSE.md" ] \
              || { echo "::error::$d has no LICENSE.md"; bad=1; }
            for stray in LICENSE-MIT LICENSE-APACHE LICENSE LICENSE.txt; do
              [ -e "$d/$stray" ] \
                && { echo "::error::$d/$stray shadows LICENSE.md (W0.23)"; bad=1; }
            done
          done
          [ "$n" -eq 18 ] || {
            echo "::error::derived $n crates, expected 18"
            bad=1
          }
          [ "$bad" -eq 0 ] || exit 1
          echo "all $n crates declare the same five licences and ship LICENSE.md"

  # `T13.2`: a test that cannot fail is not a test, and this repository has
  # shipped several — the first property tests passed vacuously (`lib:A-17`),
  # and a `compile_fail` doctest passed because the block never compiled for an
  # unrelated reason. Both were found by mutating the code and watching the
  # suite stay green.
  #
  # **Scoped to the diff, deliberately.** A full run is hours per crate — the
  # measurement in `lib:A-09` was taken module by module by hand and is a
  # point-in-time figure, not a standing guarantee. What this job asserts is
  # narrower and affordable: *the lines this pull request changed* are covered
  # by a test that notices when they change meaning. That is where untested
  # code actually arrives.
  #
  # It does not assert the rest of the tree is mutation-clean. It is not. The
  # `T13.2` row in each conformance matrix says so, and this job must not be
  # cited as though it said otherwise (`W0.3`).
  mutants:
    name: changed lines are mutation-tested
    runs-on: ubuntu-latest
    # Needs a base to diff against, and **both** event kinds have one.
    #
    # This was `if: github.event_name == 'pull_request'`, reasoning that a push
    # to main has "no meaningful diff scope". A push has `github.event.before`,
    # which is exactly the diff scope, and the consequence of not using it was
    # that **every commit made directly to `main` bypassed this gate entirely**
    # — nine of them in a row on 2026-08-20/21, including a rewrite of
    # `Interval::contains`, the `DV_URI` validation path, and the AQL lexer.
    # The one check that exists to catch untested changed lines ran on none of
    # them, and reported `skipped`, which reads as "nothing to do".
    #
    # The only case with genuinely no base is the first push of a new branch,
    # where `event.before` is all zeros. That is skipped **loudly**, in the step
    # itself, rather than by an `if` that cannot say why (`C0.13`).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        crate: [openehr, openehr-store, openehr-sqlite, openehr-loco]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # `--relative` is load-bearing, and its absence fails **silently**.
      # cargo-mutants resolves a diff's paths against the workspace it runs in,
      # and every crate here is its own workspace. A diff naming
      # `openehr-store/src/integrity.rs`, fed to a run inside `openehr-store/`,
      # matches nothing: cargo-mutants prints "No mutants to filter" and exits
      # **0**. Measured, not assumed — the wrong-prefix case was run to see
      # which way it failed, and it fails green.
      #
      # So the paths must come out as `src/integrity.rs`, and the step after
      # this one checks that they resolve rather than trusting that they did.
      - name: Diff against the base
        working-directory: ${{ matrix.crate }}
        env:
          # A pull request diffs against its target branch; a push diffs against
          # what was there before it. Three dots for the PR (merge base) and two
          # for the push (the actual range pushed) -- a push is not a merge and
          # has no base to find.
          BASE: ${{ github.event_name == 'pull_request'
                    && format('origin/{0}...HEAD', github.base_ref)
                    || format('{0}..HEAD', github.event.before) }}
        run: |
          set -eu
          case "$BASE" in
            0000000000000000000000000000000000000000..*)
              echo "::notice::first push of this ref — no previous commit to"
              echo "::notice::diff against, so there are no changed lines to"
              echo "::notice::mutate. Not a pass: there was nothing to check."
              : > /tmp/pr.diff ;;
            *)
              git diff --relative "$BASE" -- '*.rs' > /tmp/pr.diff ;;
          esac
          wc -l < /tmp/pr.diff | xargs echo "diff lines:"

      # `--in-diff` mutates only lines the diff touched. `--test-workspace` is
      # not used: each crate is its own workspace, which is the point.
      #
      # A survivor fails the job. The remedy is a test, or — where the mutant is
      # genuinely equivalent — a `#[mutants::skip]` with the reason written next
      # to it, which is the same standard the rest of the tree holds: a gap not
      # written down reads as a pass (`W0.4`). A survivor is sometimes neither:
      # `Parser::integer`'s unreachable guard turned out to be evidence of a
      # missing feature rather than a missing test (`lib:A-27`).
      - name: Mutate the changed lines
        working-directory: ${{ matrix.crate }}
        # The global `-D warnings` is dropped here on purpose. A mutant often
        # leaves a variable unused, and under `-D warnings` that build fails —
        # which cargo-mutants scores as *unviable*, not as caught. The check
        # would quietly get weaker rather than louder, which is the failure
        # mode this whole file exists to avoid.
        env:
          RUSTFLAGS: ""
        run: |
          set -eu
          if ! grep -q '^+++ b/' /tmp/pr.diff; then
            echo "no Rust changes in ${{ matrix.crate }}"
            exit 0
          fi

          # Every path the diff names must exist relative to this crate. This
          # is the check a mutant count cannot make: a diff whose changed lines
          # are all comments or attributes legitimately yields zero mutants, so
          # "zero" is not by itself evidence of anything. What is evidence is
          # whether cargo-mutants is being handed paths it can resolve at all.
          bad=0
          for f in $(grep '^+++ b/' /tmp/pr.diff | sed 's|^+++ b/||'); do
            [ "$f" = /dev/null ] && continue
            [ -f "$f" ] || {
              echo "::error::diff names $f, absent from ${{ matrix.crate }}/;"
              echo "::error::--in-diff would match nothing and exit 0"
              bad=1
            }
          done
          [ "$bad" -eq 0 ] || exit 1

          # `--json` so the count is readable afterwards. A run that mutates
          # nothing is legitimate — a diff touching only tests, comments, or
          # attributes yields no mutants, because cargo-mutants does not mutate
          # `#[cfg(test)]` code — but it is **not** evidence, and in a green
          # summary it looks identical to a run that tested two hundred.
          #
          # The path guard above already covers the other way to get zero (a
          # diff whose paths do not resolve, which exits 0 saying "No mutants to
          # filter"). This says which zero it was.
          cargo mutants --in-diff /tmp/pr.diff -j 2 --timeout 300 --output /tmp/mutants
          # `outcomes` includes the unmutated baseline run, which is not a
          # mutant. Counting it would report 16 where cargo-mutants says 15,
          # and a count that is off by one is a count nobody trusts twice.
          tested=$(python3 -c "
          import json, pathlib
          p = pathlib.Path('/tmp/mutants/mutants.out/outcomes.json')
          if not p.is_file():
              print(0)
          else:
              o = json.loads(p.read_text())['outcomes']
              print(sum(1 for x in o if x['scenario'] != 'Baseline'))
          ")
          if [ "$tested" -eq 0 ]; then
            echo "::notice::0 mutants: this diff changed no mutable code in"
            echo "::notice::${{ matrix.crate }} — tests, comments, or attributes only."
            echo "::notice::A pass here is the absence of a question, not an answer."
          else
            echo "$tested mutants tested, all caught"
          fi
