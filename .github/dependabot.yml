# Dependabot configuration. Alerts and automated security fixes are
# repository settings, enabled 2026-08-26 alongside private vulnerability
# reporting and secret scanning; this file registers every lockfile so those
# have full coverage, while keeping routine version-update PRs off.
#
# One cargo entry per workspace: this monorepo is eighteen separate Cargo
# workspaces with no root workspace (see AGENTS.md), every one with a
# committed Cargo.lock, and dependabot scopes cargo to a directory's own
# lockfile.
#
# `open-pull-requests-limit: 0` on every cargo entry, deliberately: version
# updates here are security posture, not a treadmill. The sibling fhir-rust
# repository ran this file with default limits and got 47 PRs in the first
# hour, many of them major bumps, each triggering full CI — and this
# repository upgrades deliberately, with verification, under an MSRV floor
# (spec/rust-msrv-n-minus-2). With the limit at 0 dependabot still watches
# every lockfile and raises alerts. It does NOT stop a security-update PR --
# that mechanism is separate from `open-pull-requests-limit`, which governs
# only routine version-update PRs, and it is what actually went red on
# 2026-08-29: an automated cookie fix that could not be applied without
# downgrading `@sveltejs/adapter-static` by three major versions. The real
# fix there was resolving the advisory directly (`pnpm.overrides` in
# `openehr-rust.github.io/pnpm-workspace.yaml`), not this file -- there is no
# setting here that silences a security PR Dependabot cannot resolve; the
# vulnerability has to actually be gone. Raising the routine-update limit is
# one line here when the posture changes.
#
# The npm entry below was previously absent -- Dependabot found and scanned
# `openehr-rust.github.io` anyway, because security updates apply regardless
# of whether an ecosystem is registered here. Registering it makes the
# routine-update posture explicit and consistent with every cargo entry,
# rather than left to Dependabot's own default (unlimited).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: npm
    directory: /openehr-rust.github.io
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: cargo
    directory: /openehr
    open-pull-requests-limit: 0
    schedule:
